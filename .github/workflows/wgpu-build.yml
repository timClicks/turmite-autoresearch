name: Portable GPU compilation

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: wgpu-build-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.98.1
  PROPTEST_RNG_SEED: '20261023'

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: wgpu-${{ matrix.os }}
      # These targets validate WGSL and CLI parsing without requesting a GPU.
      # Real adapter checks live in tests/portable_gpu.rs and must run on hardware.
      - run: cargo test --release --locked --features wgpu --lib --bin wgpu_sweep
