name: Research blog

on:
  push:
    branches: [main]
    paths: ['blog/**', 'experiments/**', 'research-outputs/cube-root-growth-paper/**', 'pyproject.toml', 'uv.lock', '.github/workflows/blog.yml']
  pull_request:
    paths: ['blog/**', 'experiments/**', 'research-outputs/cube-root-growth-paper/**', 'pyproject.toml', 'uv.lock', '.github/workflows/blog.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          # export_results.py pins provenance to `git log -1 -- <inputs>`; a
          # shallow clone would report HEAD and fail the --check.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check interactive blog instruments
        run: |
          npm ci --prefix web
          node blog/scripts/test_stats.js
          node blog/scripts/test_ants.js
          node blog/scripts/test_widgets.js
          node blog/scripts/test_experiment.js
          python3 blog/scripts/test_atlas.py
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.5.15'
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: blog
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v5
      - name: Write deployment configuration
        working-directory: blog
        env:
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          ruby -rjson -e 'File.write("_deploy.yml", {"url" => ENV.fetch("SITE_ORIGIN"), "baseurl" => ENV.fetch("SITE_BASE_PATH"), "repository_url" => ENV.fetch("REPOSITORY_URL")}.to_json)'
      - name: Render experiment records and saved notebooks
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          uv run --frozen --only-group blog blog/scripts/test_experiments.py
          uv run --frozen --only-group blog blog/scripts/export_results.py --check
          uv run --frozen --only-group blog blog/scripts/experiments.py --baseurl "$SITE_BASE_PATH" --repository-url "$REPOSITORY_URL"
          python3 blog/scripts/atlas.py
      - name: Build
        working-directory: blog
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --strict_front_matter --config _config.yml,_deploy.yml
      - name: Check generated links
        working-directory: blog
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bundle exec ruby scripts/check.rb _site "$SITE_BASE_PATH"
      - name: Check preliminary result cards
        run: node blog/scripts/test_results.js
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          path: blog/_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
