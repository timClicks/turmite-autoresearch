name: Small reproducibility checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.98.1
  UV_PYTHON: '3.12'

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: reproducibility
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.5.15'
          enable-cache: true
      - run: uv python install 3.12
      - run: cargo build --release --locked --bin sweep --bin sweep_lean --bin probe
      - name: Compare thread counts and record provenance
        run: uv run --frozen python .github/scripts/check_determinism.py --output "$RUNNER_TEMP/reproducibility"
      - name: Seeded analysis scripts are independent of hash order
        run: uv run --frozen python .github/scripts/check_python_determinism.py
      - name: Check analysis against exact answers and an independent PRESS calculation
        run: uv run --frozen python experiments/archive/2026-10-fixed-area-cycles/scripts/check_analysis.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproducibility
          path: ${{ runner.temp }}/reproducibility
          retention-days: 14
