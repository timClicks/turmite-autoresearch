title: turmite-autoresearch
description: "Why do Langton’s ants spend so long revisiting old ground? Conjectures, experiments, and awkward results from turmite-autoresearch."
url: ""
baseurl: ""
# GitHub Actions overrides this with the repository being built.
repository_url: "https://github.com/timClicks/turmite-autoresearch"
lang: en-NZ
timezone: Pacific/Auckland
permalink: /:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-redirect-from
defaults:
  - scope:
      path: ""
    values:
      layout: page
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Turmite researchers
      status: Field note
exclude:
  - experiment-guides.tsv
  - experiment-figures.json
  - atlas.json
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - templates
